<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waktu Sholat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <div class="location-date">
                <h1 id="location">Mencari lokasi...</h1>
                <p id="date"></p>
            </div>
        </header>
        <main>
            <div class="current-prayer">
                <h2 id="current-prayer-name">Subuh</h2>
                <p id="current-prayer-time">04:30</p>
                <p id="countdown">-0:00:00</p>
            </div>
            <div class="prayer-times">
                <div class="prayer-time-item">
                    <span>Subuh</span>
                    <span id="fajr-time">04:30</span>
                </div>
                <div class="prayer-time-item">
                    <span>Dzuhur</span>
                    <span id="dhuhr-time">12:00</span>
                </div>
                <div class="prayer-time-item">
                    <span>Ashar</span>
                    <span id="asr-time">15:30</span>
                </div>
                <div class="prayer-time-item">
                    <span>Maghrib</span>
                    <span id="maghrib-time">18:00</span>
                </div>
                <div class="prayer-time-item">
                    <span>Isya</span>
                    <span id="isha-time">19:15</span>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
